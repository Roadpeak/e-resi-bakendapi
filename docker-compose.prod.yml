# Production stack for e-resi on the KPM/DON droplet at 164.90.176.12.
# Backend (NestJS) + Postgres + Redis + Frontend (Next.js) + Nginx ingress.

x-app: &app-env
  restart: unless-stopped
  networks: [app_net]
  env_file:
    - .env
  environment:
    NODE_ENV: production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: eresi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [app_net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app_net]

  backend:
    <<: *app-env
    image: ghcr.io/roadpeak/e-resi-bakendapi:${IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Frontend (Next.js) — image built by the e-resi-frontend repo ─────────
  # FRONTEND_IMAGE_TAG is written to the SHA by the frontend deploy workflow.
  # pull_policy: never — this workflow's GHCR token can auth against the
  # sibling repo (both live in the Roadpeak org, same PAT), but the flag
  # protects backend deploys from touching the FE container regardless.
  frontend:
    image: ghcr.io/roadpeak/e-resi-frontend:${FRONTEND_IMAGE_TAG:-latest}
    pull_policy: never
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    networks: [app_net]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # No depends_on: frontend — matches the KPM pattern so backend deploys
    # never transitively try to start the FE container. Each workflow
    # restarts nginx explicitly after its own change.
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # CF origin cert + private key (CF-signed, 15-yr, only trusted by CF).
      # Certs live on host at /home/deploy/e-resi/certs (not in repo).
      - /home/deploy/e-resi/certs:/etc/nginx/certs:ro
    networks: [app_net]

volumes:
  postgres_data:
  redis_data:

networks:
  app_net:
    driver: bridge
