name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/e-resi-bakendapi
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build image and push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: img
        run: echo "name=$(echo '${{ env.IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to droplet
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose + config to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "docker-compose.prod.yml,nginx/nginx.conf,nginx/cf-ips.conf,nginx/cf-allowlist.conf"
          target: "/home/deploy/e-resi/"
          overwrite: true

      - name: Deploy on droplet
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
          JWT_REFRESH_EXPIRES_IN: ${{ secrets.JWT_REFRESH_EXPIRES_IN }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          # SMTP / OAuth / S3 / payments — placeholder now, real when creds land.
          # Empty values are harmless: only integration code paths fail.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL: ${{ secrets.GOOGLE_CALLBACK_URL }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_CALLBACK_URL: ${{ secrets.APPLE_CALLBACK_URL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          PAYSTACK_PUBLIC_KEY: ${{ secrets.PAYSTACK_PUBLIC_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          MPESA_CONSUMER_KEY: ${{ secrets.MPESA_CONSUMER_KEY }}
          MPESA_CONSUMER_SECRET: ${{ secrets.MPESA_CONSUMER_SECRET }}
          MPESA_SHORTCODE: ${{ secrets.MPESA_SHORTCODE }}
          MPESA_PASSKEY: ${{ secrets.MPESA_PASSKEY }}
          MPESA_CALLBACK_URL: ${{ secrets.MPESA_CALLBACK_URL }}
          MPESA_ENV: ${{ secrets.MPESA_ENV }}
          GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: IMAGE_TAG,POSTGRES_USER,POSTGRES_PASSWORD,REDIS_PASSWORD,JWT_SECRET,JWT_REFRESH_SECRET,JWT_EXPIRES_IN,JWT_REFRESH_EXPIRES_IN,COOKIE_SECRET,FRONTEND_URL,SMTP_HOST,SMTP_PORT,SMTP_SECURE,SMTP_USER,SMTP_PASS,SMTP_FROM,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_CALLBACK_URL,APPLE_CLIENT_ID,APPLE_TEAM_ID,APPLE_KEY_ID,APPLE_PRIVATE_KEY,APPLE_CALLBACK_URL,CLOUDINARY_CLOUD_NAME,CLOUDINARY_API_KEY,CLOUDINARY_API_SECRET,PAYSTACK_SECRET_KEY,PAYSTACK_PUBLIC_KEY,STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET,MPESA_CONSUMER_KEY,MPESA_CONSUMER_SECRET,MPESA_SHORTCODE,MPESA_PASSKEY,MPESA_CALLBACK_URL,MPESA_ENV,GHCR_PULL_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            cd /home/deploy/e-resi

            DB_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/eresi?schema=public"
            REDIS_URL="redis://:${REDIS_PASSWORD}@redis:6379"

            umask 077
            cat > .env.new <<EOF
            IMAGE_TAG=${IMAGE_TAG}
            NODE_ENV=production
            PORT=4000
            API_PREFIX=api
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            DATABASE_URL=${DB_URL}
            REDIS_PASSWORD=${REDIS_PASSWORD}
            REDIS_URL=${REDIS_URL}
            REDIS_HOST=redis
            REDIS_PORT=6379
            JWT_SECRET="${JWT_SECRET}"
            JWT_REFRESH_SECRET="${JWT_REFRESH_SECRET}"
            JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
            JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
            COOKIE_SECRET="${COOKIE_SECRET}"
            FRONTEND_URL=${FRONTEND_URL}
            SMTP_HOST=${SMTP_HOST}
            SMTP_PORT=${SMTP_PORT:-587}
            SMTP_SECURE=${SMTP_SECURE:-false}
            SMTP_USER=${SMTP_USER}
            SMTP_PASS="${SMTP_PASS}"
            SMTP_FROM="${SMTP_FROM}"
            GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
            GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
            APPLE_CLIENT_ID=${APPLE_CLIENT_ID}
            APPLE_TEAM_ID=${APPLE_TEAM_ID}
            APPLE_KEY_ID=${APPLE_KEY_ID}
            APPLE_PRIVATE_KEY="${APPLE_PRIVATE_KEY}"
            APPLE_CALLBACK_URL=${APPLE_CALLBACK_URL}
            CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
            CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
            CLOUDINARY_API_SECRET="${CLOUDINARY_API_SECRET}"
            PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY}
            PAYSTACK_PUBLIC_KEY=${PAYSTACK_PUBLIC_KEY}
            STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
            STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
            MPESA_CONSUMER_KEY=${MPESA_CONSUMER_KEY}
            MPESA_CONSUMER_SECRET=${MPESA_CONSUMER_SECRET}
            MPESA_SHORTCODE=${MPESA_SHORTCODE:-174379}
            MPESA_PASSKEY=${MPESA_PASSKEY}
            MPESA_CALLBACK_URL=${MPESA_CALLBACK_URL}
            MPESA_ENV=${MPESA_ENV:-sandbox}
            EOF
            mv .env.new .env

            echo "${GHCR_PULL_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            # Enumerate services so `up -d` can't transitively touch the
            # frontend container (owned by the sibling repo's workflow).
            SERVICES="postgres redis nginx backend"
            docker compose -f docker-compose.prod.yml pull $SERVICES
            docker compose -f docker-compose.prod.yml up -d $SERVICES

            docker compose -f docker-compose.prod.yml restart nginx
            docker image prune -f

      - name: Verify running containers
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd /home/deploy/e-resi
            sleep 12
            docker compose -f docker-compose.prod.yml ps
