# Cloudflare edge IP ranges — historical placeholder.
# We used to do `set_real_ip_from` here to rewrite $remote_addr from
# CF-Connecting-IP, but that ran BEFORE the ngx_http_access_module's
# allow/deny check, breaking the CF-only enforcement (allow list saw
# the real client IP, not the CF edge, so ALL traffic got denied).
#
# Now: $remote_addr stays as the direct TCP peer (CF edge). The real
# client IP is available downstream via the CF-Connecting-IP header
# that CF injects on every request — backend services should read
# that header for auditing / rate-limiting per-user.
#
# Left as an empty include so the compose mount and any future http-scope
# additions have a home.
