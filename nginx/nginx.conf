# Rate-limit zones at http scope (this file is included from /etc/nginx/conf.d/).
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

server_tokens off;
client_max_body_size 25m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─── 0. Default catch-alls — reject unknown Host on 80 and 443 ───────────────
# Port 80: some third parties (e.g. gr-agency.marketing 2026-08-04 incident)
# point their DNS at our IP hoping to piggyback on our site. 444 hangs up
# without a byte back — better than 404, better than serving.
#
# Port 443: same idea, but reject at TLS layer via mandatory client-cert.
# Without a valid CF origin-pull cert the handshake fails before HTTP.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    http2 on;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate         /etc/nginx/certs/origin.crt;
    ssl_certificate_key     /etc/nginx/certs/origin.key;
    ssl_client_certificate  /etc/nginx/certs/cloudflare-origin-pull-ca.pem;
    ssl_verify_client       on;

    return 444;
}

# ─── 1. API host — api.e-resi.com → backend ──────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name api.e-resi.com;

    ssl_certificate         /etc/nginx/certs/origin.crt;
    ssl_certificate_key     /etc/nginx/certs/origin.key;
    ssl_client_certificate  /etc/nginx/certs/cloudflare-origin-pull-ca.pem;
    ssl_verify_client       on;

    send_timeout 10s;
    keepalive_timeout 15s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(), payment=(), usb=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain application/json application/javascript application/xml text/css text/xml;

    limit_conn conn_zone 30;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location ~ ^/api/(auth|users/register|users/login) {
        limit_req zone=auth_zone burst=10 nodelay;
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_zone burst=50 nodelay;
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(auth|users/register|users/login)(/|$) {
        limit_req zone=auth_zone burst=10 nodelay;
        rewrite ^(.*)$ /api$1 break;
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=api_zone burst=50 nodelay;
        rewrite ^(.*)$ /api$1 break;
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─── 2. Web host — e-resi.com + www + app → frontend, /api/* → backend ───────
server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name app.e-resi.com e-resi.com www.e-resi.com;

    ssl_certificate         /etc/nginx/certs/origin.crt;
    ssl_certificate_key     /etc/nginx/certs/origin.key;
    ssl_client_certificate  /etc/nginx/certs/cloudflare-origin-pull-ca.pem;
    ssl_verify_client       on;

    send_timeout 10s;
    keepalive_timeout 15s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(), payment=(), usb=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain application/json application/javascript application/xml text/css text/xml;

    limit_conn conn_zone 30;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location ~ ^/api/(auth|users/register|users/login) {
        limit_req zone=auth_zone burst=10 nodelay;
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_zone burst=50 nodelay;
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
