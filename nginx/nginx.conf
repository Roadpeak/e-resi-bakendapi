# Rate-limit zones at http scope (this file is included from /etc/nginx/conf.d/).
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

server_tokens off;
client_max_body_size 25m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─── 1. API host — api.e-resi.com → backend ──────────────────────────────────
# NestJS backend uses `setGlobalPrefix('api')`, so REST routes live at /api/*.
# When the frontend calls the api. host without the /api prefix (e.g.
# POST /auth/login), we rewrite it in. Paths that already start with /api,
# or the Swagger docs, or /healthz, bypass the rewrite.
server {
    listen 80;
    listen [::]:80;
    server_name api.e-resi.com;

    send_timeout 10s;
    keepalive_timeout 15s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(), payment=(), usb=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain application/json application/javascript application/xml text/css text/xml;

    limit_conn conn_zone 30;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Auth-adjacent routes get the tighter auth_zone limit.
    location ~ ^/api/(auth|users/register|users/login) {
        limit_req zone=auth_zone burst=10 nodelay;
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_zone burst=50 nodelay;
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Catch-all — prepend /api. Handles callers that hit bare paths.
    location ~ ^/(auth|users/register|users/login)(/|$) {
        limit_req zone=auth_zone burst=10 nodelay;
        rewrite ^(.*)$ /api$1 break;
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=api_zone burst=50 nodelay;
        rewrite ^(.*)$ /api$1 break;
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─── 0. Default catch-all — REJECT unknown hosts ─────────────────────────────
# Without this, nginx serves our site for any Host header pointed at this IP
# (e.g. gr-agency.marketing had its DNS pointed at 164.90.176.12 and was
# effectively cloning our frontend). Return 444 (nginx-specific: close the
# connection with no response) for anything not in an explicit server_name.
# 444 is preferred over 404 because it gives scanners/scrapers zero content
# to work with. Legit traffic always arrives on e-resi.com / api.e-resi.com
# via Cloudflare and hits the matching server blocks below.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# ─── 2. Web host — e-resi.com + www → frontend, /api/* → backend ─────────────
# Same-origin /api/* pass-through so the browser can hit the API without CORS.
server {
    listen 80;
    listen [::]:80;
    server_name app.e-resi.com e-resi.com www.e-resi.com;

    send_timeout 10s;
    keepalive_timeout 15s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(), payment=(), usb=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain application/json application/javascript application/xml text/css text/xml;

    limit_conn conn_zone 30;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location ~ ^/api/(auth|users/register|users/login) {
        limit_req zone=auth_zone burst=10 nodelay;
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_zone burst=50 nodelay;
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else → frontend (Next.js). Static assets under /_next/*,
    # HTML routes, and the landing page.
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
